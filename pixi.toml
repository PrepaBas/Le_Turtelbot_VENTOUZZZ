[workspace]
authors = ["TRAN-RUESCHE Bastien <btranruesch@gmail.com>"]
channels = ['robostack-jazzy', 'conda-forge']
name = "ws"
platforms = ['linux-64']
version = "0.1.0"

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-turtlebot3 = ">=2.3.7,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
lttng-ust = ">=2.13.9,<3"
compilers = ">=2.0.0,<3"
cmake = "*"
ninja = "*"
pkg-config = "*"
ros-jazzy-ament-cmake = "*"
libudev = ">=262.2,<263"

[activation.env]
ROS_DOMAIN_ID = "4"
TURTLEBOT3_MODEL = "burger"
LDS_MODEL = "LDS-02"

[tasks]
build-ld08 = "colcon build --packages-select ld08_driver --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release"
ld08 = "bash -c 'source install/setup.bash && ros2 launch ld08_driver ld08.launch.py'"
